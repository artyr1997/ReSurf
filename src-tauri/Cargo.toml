[package]
name = "resurf"
version = "0.1.0"
description = "ReSurf — just the web. A quiet browser in the ReNote style."
authors = ["Artur Savytskyi"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "resurf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# `unstable` gives windows several webviews: the UI plus one per tab
tauri = { version = "2.12.5", features = ["unstable", "macos-private-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
# the ad blocker: a WebKit content rule list on every tab (src/lib.rs, mod adblock)
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKWebView", "WKWebViewConfiguration"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSArray"] }
block2 = "0.6.2"
